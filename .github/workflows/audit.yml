name: Dependency audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix server audit --omit=dev --audit-level=high
